# Build the library targets with CMake (cereal and oneTBB fetched by FetchContent), then build and run the
# test drivers of bench/ (test_graph, test_synth, test_order) and the unit tests of the containers.
name: CMake on single platform

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Boost headers and TBB
      run: sudo apt-get update && sudo apt-get install -y libboost-dev libtbb-dev

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j 4

    - name: Build the test drivers
      working-directory: ${{github.workspace}}/bench
      run: make test_graph test_synth test_order CEREAL_INC=${{github.workspace}}/build/_deps/cereal-src/include

    - name: Test
      working-directory: ${{github.workspace}}/bench
      run: |
        ./test_graph
        ./test_synth
        ./test_order
        ../build/ConsoleApplication1
